services:
  oauth-keygen:
    image: "alpine:3.20"
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        mkdir -p /oauth2 /acme

        if [ ! -s /oauth2/private.pem ]; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /oauth2/private.pem
        fi

        if [ ! -s /acme/account.pem ]; then
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out /acme/account.pem
        fi

        chown 0:65532 /oauth2/private.pem /acme/account.pem
        chmod 640 /oauth2/private.pem /acme/account.pem
    volumes:
      - "oauth2-key:/oauth2"
      - "acme-account-key:/acme"

  postgres:
    image: "postgres@sha256:7ad98329d513dd497293b951c195ca354274a77f12ddbbbbf85e68a811823d72"
    restart: unless-stopped
    shm_size: "1g"
    command: >
      postgres -c "shared_buffers=256MB"
               -c "max_connections=200"
               -c "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRESADMIN}
    volumes:
      - "postgres-data:/var/lib/postgresql/data:rw"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: "postgres@sha256:7ad98329d513dd497293b951c195ca354274a77f12ddbbbbf85e68a811823d72"
    restart: "no"
    exclude_from_hc: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRESADMIN}
      PROBOD_DB_PASSWORD: ${SERVICE_PASSWORD_64_PROBODDB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until pg_isready -h postgres -U postgres; do sleep 1; done

        if PGPASSWORD="$${POSTGRES_ADMIN_PASSWORD}" psql -h postgres -U postgres -d postgres -tAc "SELECT 1" >/dev/null 2>&1; then
          export PGPASSWORD="$${POSTGRES_ADMIN_PASSWORD}"
        elif PGPASSWORD="postgres" psql -h postgres -U postgres -d postgres -tAc "SELECT 1" >/dev/null 2>&1; then
          export PGPASSWORD="postgres"
          psql -h postgres -U postgres -d postgres -c "ALTER ROLE postgres PASSWORD '$${POSTGRES_ADMIN_PASSWORD}'"
          export PGPASSWORD="$${POSTGRES_ADMIN_PASSWORD}"
        else
          echo "Cannot authenticate to PostgreSQL with generated or legacy administrator credentials" >&2
          exit 1
        fi

        if ! psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='probod'" | grep -q 1; then
          psql -h postgres -U postgres -c "CREATE ROLE probod LOGIN PASSWORD '$${PROBOD_DB_PASSWORD}'"
        fi

        psql -h postgres -U postgres -c "ALTER ROLE probod LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '$${PROBOD_DB_PASSWORD}'"
        if ! psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='probod'" | grep -q 1; then
          createdb -h postgres -U postgres -O probod probod
        fi
        psql -h postgres -U postgres -d postgres -c "ALTER DATABASE probod OWNER TO probod"
        psql -h postgres -U postgres -d probod -c "ALTER SCHEMA public OWNER TO probod"
        psql -h postgres -U postgres -d probod -c "GRANT ALL ON SCHEMA public TO probod"

        # pg_stat_statements is the one Probo extension migration that requires
        # elevated installation privileges. Its migration already uses
        # IF NOT EXISTS, so installing it here is safe and lets the long-running
        # application remain a non-superuser. Other extensions are deliberately
        # left to Probo's own migration sequence.
        psql -h postgres -U postgres -d probod -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"

  seaweed-config-init:
    image: "alpine:3.20"
    restart: "no"
    exclude_from_hc: true
    environment:
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_OBJECTSTORE}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /config
        cat > /config/s3.json <<JSON
        {
          "identities": [
            {
              "name": "probod",
              "credentials": [
                {
                  "accessKey": "probod",
                  "secretKey": "$${S3_SECRET_KEY}"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging", "Lock"]
            }
          ]
        }
        JSON
        chown 1000:1000 /config/s3.json
        chmod 600 /config/s3.json
    volumes:
      - "seaweedfs-config:/config"

  seaweedfs:
    image: "chrislusf/seaweedfs@sha256:cea8339d21dad1b200adce581dd7434d254b8f5975f142c3b4c930ba78647eef"
    restart: unless-stopped
    depends_on:
      seaweed-config-init:
        condition: service_completed_successfully
    command: >
      server
      -s3
      -s3.config=/etc/seaweedfs/s3.json
      -s3.port=8333
      -volume.max=100
      -master.volumeSizeLimitMB=1024
      -dir=/data
    volumes:
      - "seaweedfs-config:/etc/seaweedfs:ro"
      - "seaweedfs-data:/data:rw"

  chrome:
    image: "chromedp/headless-shell@sha256:b24482ae166e2c67135f5a8ba9575c257efdd8e2fd6b2e931f9d88ede3d72f3b"
    restart: unless-stopped
    command:
      - "--headless"
      - "--disable-gpu"
      - "--disable-dev-shm-usage"
      - "--hide-scrollbars"
      - "--mute-audio"
      - "--no-default-browser-check"
      - "--no-first-run"
      - "--disable-background-networking"
      - "--disable-background-timer-throttling"
      - "--disable-extensions"

  probo:
    build:
      context: "."
      dockerfile: "Dockerfile.compplus"
    restart: unless-stopped
    group_add:
      - "65532"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export PROBOD_OAUTH2_SERVER_SIGNING_KEY="$$(cat /oauth2/private.pem)"
        export PROBOD_ACME_ACCOUNT_KEY="$$(cat /acme/account.pem)"
        exec /usr/local/bin/entrypoint.sh
    environment:
      PROBOD_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_ENCRYPTIONKEY}
      PROBOD_AUTH_COOKIE_SECRET: ${SERVICE_PASSWORD_64_COOKIESECRET}
      PROBOD_AUTH_PASSWORD_PEPPER: ${SERVICE_PASSWORD_64_PASSWORDPEPPER}
      PROBOD_TRUST_AUTH_TOKEN_SECRET: ${SERVICE_PASSWORD_64_TRUSTTOKEN}

      PROBOD_BASE_URL: "${ISOPILOT_PUBLIC_URL:-http://xcqx8pquoua5s54aey3plps1.72.61.16.251.sslip.io}"
      PROBOD_API_ADDR: ":8080"
      PROBOD_API_CORS_ALLOWED_ORIGINS: "${ISOPILOT_CORS_ORIGINS:-http://xcqx8pquoua5s54aey3plps1.72.61.16.251.sslip.io,http://72.61.16.251:8090}"
      PROBOD_API_GRAPHQL_DISABLE_SUGGESTION: "true"

      PROBOD_AUTH_COOKIE_NAME: "ISOPILOT_SSID"
      PROBOD_AUTH_COOKIE_DOMAIN: "${ISOPILOT_COOKIE_DOMAIN:-}"
      PROBOD_AUTH_COOKIE_SECURE: "${ISOPILOT_COOKIE_SECURE:-false}"
      PROBOD_AUTH_COOKIE_SAMESITE: "lax"
      PROBOD_AUTH_COOKIE_DURATION: "12"
      PROBOD_AUTH_DISABLE_SIGNUP: "${ISOPILOT_DISABLE_SIGNUP:-false}"
      PROBOD_AUTH_PASSWORD_ITERATIONS: "1000000"
      PROBOD_AUTH_INVITATION_TOKEN_VALIDITY: "3600"
      PROBOD_AUTH_EMAIL_CONFIRMATION_TOKEN_VALIDITY: "3600"
      PROBOD_AUTH_PASSWORD_RESET_TOKEN_VALIDITY: "3600"
      PROBOD_AUTH_MAGIC_LINK_TOKEN_VALIDITY: "900"

      PROBOD_AUTH_GOOGLE_CLIENT_ID: "${ISOPILOT_GOOGLE_CLIENT_ID:-}"
      PROBOD_AUTH_GOOGLE_CLIENT_SECRET: "${ISOPILOT_GOOGLE_CLIENT_SECRET:-}"
      PROBOD_AUTH_MICROSOFT_CLIENT_ID: "${ISOPILOT_MICROSOFT_CLIENT_ID:-}"
      PROBOD_AUTH_MICROSOFT_CLIENT_SECRET: "${ISOPILOT_MICROSOFT_CLIENT_SECRET:-}"

      PROBOD_PG_ADDR: "postgres:5432"
      PROBOD_PG_USERNAME: "probod"
      PROBOD_PG_PASSWORD: ${SERVICE_PASSWORD_64_PROBODDB}
      PROBOD_PG_DATABASE: "probod"
      PROBOD_PG_POOL_SIZE: "100"
      PROBOD_PG_MIN_POOL_SIZE: "10"
      PROBOD_PG_DEBUG: "false"

      PROBOD_AWS_REGION: "us-east-1"
      PROBOD_AWS_BUCKET: "probod"
      PROBOD_AWS_ACCESS_KEY_ID: "probod"
      PROBOD_AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_64_OBJECTSTORE}
      PROBOD_AWS_ENDPOINT: "http://seaweedfs:8333"
      PROBOD_AWS_USE_PATH_STYLE: "true"

      PROBOD_METRICS_ADDR: ":8081"
      PROBOD_TRACING_ADDR: ""
      PROBOD_TRUST_CENTER_BASE_DOMAIN: "${ISOPILOT_TRUST_CENTER_DOMAIN:-}"

      PROBOD_ACME_DIRECTORY: "${ISOPILOT_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}"
      PROBOD_ACME_EMAIL: "${ISOPILOT_ACME_EMAIL:-no-reply@isopilot.co.uk}"
      PROBOD_ACME_KEY_TYPE: "EC256"
      PROBOD_CUSTOM_DOMAINS_CAA_ISSUER_DOMAIN: "letsencrypt.org"
      PROBOD_CUSTOM_DOMAINS_RESOLVER_ADDR: "${ISOPILOT_DNS_RESOLVER_ADDR:-1.1.1.1:53}"
      PROBOD_CUSTOM_DOMAINS_CNAME_TARGET: "${ISOPILOT_CUSTOM_DOMAINS_CNAME_TARGET:-}"

      PROBOD_SMTP_ADDR: "${ISOPILOT_SMTP_ADDR:-}"
      PROBOD_SMTP_USER: "${ISOPILOT_SMTP_USER:-}"
      PROBOD_SMTP_PASSWORD: "${ISOPILOT_SMTP_PASSWORD:-}"
      PROBOD_SMTP_TLS_REQUIRED: "${ISOPILOT_SMTP_TLS_REQUIRED:-true}"
      PROBOD_MAILER_SENDER_NAME: "${ISOPILOT_MAILER_SENDER_NAME:-ISOPilot}"
      PROBOD_MAILER_SENDER_EMAIL: "${ISOPILOT_MAILER_SENDER_EMAIL:-no-reply@isopilot.co.uk}"

      PROBOD_CHROME_DP_ADDR: "chrome:9222"

      PROBOD_OPENAI_API_KEY: "${ISOPILOT_OPENAI_API_KEY:-disabled-for-initial-hosting}"
      PROBOD_AGENT_DEFAULT_PROVIDER: "openai"
      PROBOD_AGENT_DEFAULT_MODEL_NAME: "gpt-4o"

    ports:
      - "8090:8080"
    volumes:
      - "probo-data:/data"
      - "oauth2-key:/oauth2:ro"
      - "acme-account-key:/acme:ro"
    depends_on:
      oauth-keygen:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
      chrome:
        condition: service_started

volumes:
  probo-data:
  postgres-data:
  seaweedfs-data:
  seaweedfs-config:
  oauth2-key:
  acme-account-key:
