name: compplus-runtime-release

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.compplus
      - Dockerfile.compplus.source
      - compplus/overlay/**
      - .github/workflows/compplus-runtime-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build full Comp Plus+ image
        run: docker build --file Dockerfile.compplus.source --tag compplus:runtime .

      - name: Extract runtime files
        run: |
          set -euxo pipefail
          mkdir -p runtime
          cid="$(docker create compplus:runtime)"
          docker cp "$cid:/usr/local/bin/probod" runtime/probod
          docker cp "$cid:/usr/local/bin/probod-bootstrap" runtime/probod-bootstrap
          docker cp "$cid:/usr/local/bin/entrypoint.sh" runtime/entrypoint.sh
          docker rm "$cid"
          chmod +x runtime/probod runtime/probod-bootstrap runtime/entrypoint.sh
          tar -C runtime -czf compplus-linux-amd64.tar.gz probod probod-bootstrap entrypoint.sh
          sha256sum compplus-linux-amd64.tar.gz > compplus-linux-amd64.tar.gz.sha256

      - name: Publish rolling runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if ! gh release view runtime-latest >/dev/null 2>&1; then
            gh release create runtime-latest --target main --title "Comp Plus+ Runtime" --notes "Prebuilt Comp Plus+ runtime for Coolify deployment."
          fi
          gh release upload runtime-latest \
            compplus-linux-amd64.tar.gz \
            compplus-linux-amd64.tar.gz.sha256 \
            --clobber
