name: "compplus-template-check"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "compplus/templates/**"
      - "pkg/probo/template_pack_service*.go"
      - ".github/workflows/compplus-template-check.yaml"
  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  test:
    name: "compile-and-test-template-installer"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-go@v5"
        with:
          go-version-file: "go.mod"
          cache: true
      - name: "Show formatting differences"
        continue-on-error: true
        run: "gofmt -d compplus/templates/*.go pkg/probo/template_pack_service*.go"
      - name: "Compile and test template compiler"
        run: "go test ./compplus/templates"
      - name: "Create placeholder embedded assets"
        run: |
          mkdir -p apps/console/dist apps/compliance-portal/dist packages/emails/dist
          echo dev-server > apps/console/dist/index.html
          echo dev-server > apps/compliance-portal/dist/index.html
          for name in \
            confirm-email \
            password-reset \
            invitation \
            document-approval \
            document-signing \
            document-export \
            framework-export \
            compliance-portal-access \
            compliance-portal-document-access-rejected \
            magic-link \
            electronic-signature-certificate \
            mailing-list-subscription \
            mailing-list-unsubscription \
            mailing-list-updates \
            log-export
          do
            echo '<html><body>Build placeholder</body></html>' > "packages/emails/dist/${name}.html.tmpl"
            echo 'Build placeholder' > "packages/emails/dist/${name}.txt.tmpl"
          done
      - name: "Compile installer service"
        run: "go test ./pkg/probo -run '^$'"