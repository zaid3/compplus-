name: "make"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: "read"

jobs:
  production-dependency-audit:
    name: "production-dependency-audit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v6
      - uses: "actions/setup-node@v6"
        with:
          node-version-file: ".nvmrc"
      - name: "Use repository npm version"
        run: npm install -g npm@^11.8.0
      - name: "Audit exact shipped production workspaces"
        env:
          PROBO_UPSTREAM_SHA: "7d4b92c5ef1d77d0815f22749e01b8202d683d58"
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/getprobo/probo.git /tmp/isopilot-source
          cd /tmp/isopilot-source
          git checkout --detach "$PROBO_UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$PROBO_UPSTREAM_SHA"
          cp -a "$GITHUB_WORKSPACE/compplus/overlay/." .
          chmod +x contrib/apply-isopilot-source.sh
          contrib/apply-isopilot-source.sh
          npm audit \
            --workspace @probo/console \
            --workspace @probo/compliance-portal \
            --workspace @probo/emails \
            --omit=dev \
            --audit-level=high

  frontend-build:
    name: "frontend-build"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v6
        with:
          submodules: recursive
      - uses: "./.github/actions/setup"
        with:
          go: "false"
      - name: "Generate Relay artifacts"
        run: make relay
      - name: "Build emails"
        run: npm --workspace @probo/emails run build
      - name: "Type-check and build console"
        run: |
          npm --workspace @probo/console run check
          NODE_ENV=production npm --workspace @probo/console run build
      - name: "Type-check and build compliance portal"
        run: |
          npm --workspace @probo/compliance-portal run check
          NODE_ENV=production npm --workspace @probo/compliance-portal run build

  build-probo-agent:
    name: "build-probo-agent"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v6
        with:
          submodules: recursive
      - uses: "./.github/actions/setup"
        with:
          node: "false"
      - name: "Build probo-agent"
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go build -ldflags "-s -w -X 'main.version=snapshot'" \
            -gcflags="-e" -o bin/probo-agent ./cmd/probo-agent

  lint-js:
    name: "lint-js"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v6
        with:
          submodules: recursive
      - uses: "./.github/actions/setup"
        with:
          go: "false"
      - name: "Generate Relay artifacts"
        run: make relay
      - name: "Lint configured source packages"
        run: |
          set -euo pipefail
          for dir in \
            apps/console \
            apps/compliance-portal \
            packages/ui \
            packages/eslint-config; do
            if [ -d "$dir" ]; then
              npx eslint "$dir" --concurrency 4
            fi
          done

  lint-swift:
    name: "lint-swift"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v6
        with:
          submodules: recursive
      - uses: "swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a" # v2.4.0
        with:
          swift-version: "6.0"
      - name: "Install SwiftLint"
        env:
          SWIFTLINT_VERSION: "0.65.0"
          SWIFTLINT_SHA256: "79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b"
        run: |
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" -o /tmp/swiftlint.zip
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum -c -
          sudo unzip -o /tmp/swiftlint.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/swiftlint
          swiftlint version
      - name: "Run swift format"
        run: |
          sources="$(find cmd/probo-agent/installer/macos/enroll-ui -name '*.swift' ! -name '*.generated.swift' ! -path '*/.build/*' | sort)"
          swift format lint --configuration .swift-format --strict --parallel $sources
      - name: "Run SwiftLint"
        run: swiftlint lint --strict --config .swiftlint.yml --cache-path /tmp/swiftlint-cache

  lint-shell:
    name: "lint-shell"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v6
        with:
          submodules: recursive
      - name: "Install shellcheck and shfmt"
        env:
          SHELLCHECK_VERSION: "v0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          SHFMT_VERSION: "v3.13.1"
          SHFMT_SHA256: "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1"
        run: |
          curl -sL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -sL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" -o /tmp/shfmt
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version
      - name: "Run make lint-shell"
        run: make lint-shell
