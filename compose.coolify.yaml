services:
  compplus:
    image: "artifact.probo.inc/probo/probo:latest"
    restart: unless-stopped
    environment:
      # Coolify creates a public URL and routes it to container port 8080.
      - SERVICE_URL_COMPPLUS_8080
      - SERVICE_FQDN_COMPPLUS
      - PROBOD_BASE_URL=${SERVICE_URL_COMPPLUS_8080}
      - PROBOD_API_ADDR=:8080
      - PROBOD_API_CORS_ALLOWED_ORIGINS=${SERVICE_URL_COMPPLUS_8080}

      # Generate this once with: openssl rand -base64 32
      - PROBOD_ENCRYPTION_KEY=${PROBOD_ENCRYPTION_KEY:?}

      # Coolify generates and persists these automatically.
      - PROBOD_AUTH_COOKIE_SECRET=${SERVICE_PASSWORD_64_COOKIESECRET}
      - PROBOD_AUTH_PASSWORD_PEPPER=${SERVICE_PASSWORD_64_PASSWORDPEPPER}
      - PROBOD_TRUST_AUTH_TOKEN_SECRET=${SERVICE_PASSWORD_64_TRUSTTOKEN}

      - PROBOD_AUTH_COOKIE_NAME=COMPPLUS_SSID
      - PROBOD_AUTH_COOKIE_DOMAIN=${SERVICE_FQDN_COMPPLUS}
      - PROBOD_AUTH_COOKIE_SECURE=${PROBOD_AUTH_COOKIE_SECURE:-false}
      - PROBOD_AUTH_COOKIE_SAMESITE=lax
      - PROBOD_AUTH_DISABLE_SIGNUP=${PROBOD_AUTH_DISABLE_SIGNUP:-false}

      - PROBOD_PG_ADDR=postgres:5432
      - PROBOD_PG_USERNAME=postgres
      - PROBOD_PG_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
      - PROBOD_PG_DATABASE=probod
      - PROBOD_PG_POOL_SIZE=100
      - PROBOD_PG_MIN_POOL_SIZE=10

      - PROBOD_AWS_REGION=us-east-1
      - PROBOD_AWS_BUCKET=probod
      - PROBOD_AWS_ACCESS_KEY_ID=probod
      - PROBOD_AWS_SECRET_ACCESS_KEY=thisisnotasecret
      - PROBOD_AWS_ENDPOINT=http://seaweedfs:8333
      - PROBOD_AWS_USE_PATH_STYLE=true

      - PROBOD_CHROME_DP_ADDR=chrome:9222
      - PROBOD_METRICS_ADDR=:8081
      - PROBOD_TRACING_ADDR=

      - PROBOD_TRUST_CENTER_HTTP_ADDR=:10080
      - PROBOD_TRUST_CENTER_HTTPS_ADDR=:10443

      - PROBOD_SMTP_ADDR=${PROBOD_SMTP_ADDR:-}
      - PROBOD_SMTP_USER=${PROBOD_SMTP_USER:-}
      - PROBOD_SMTP_PASSWORD=${PROBOD_SMTP_PASSWORD:-}
      - PROBOD_SMTP_TLS_REQUIRED=${PROBOD_SMTP_TLS_REQUIRED:-false}
      - PROBOD_MAILER_SENDER_NAME=${PROBOD_MAILER_SENDER_NAME:-CompPlus}
      - PROBOD_MAILER_SENDER_EMAIL=${PROBOD_MAILER_SENDER_EMAIL:-no-reply@example.com}

      - PROBOD_OPENAI_API_KEY=${PROBOD_OPENAI_API_KEY:-}
      - PROBOD_ANTHROPIC_API_KEY=${PROBOD_ANTHROPIC_API_KEY:-}
      - PROBOD_AGENT_DEFAULT_PROVIDER=${PROBOD_AGENT_DEFAULT_PROVIDER:-openai}
      - PROBOD_AGENT_DEFAULT_MODEL_NAME=${PROBOD_AGENT_DEFAULT_MODEL_NAME:-gpt-4o}

    expose:
      - "8080"
    volumes:
      - compplus-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      chrome:
        condition: service_started

  postgres:
    image: "postgres@sha256:7ad98329d513dd497293b951c195ca354274a77f12ddbbbbf85e68a811823d72"
    restart: unless-stopped
    shm_size: "1g"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - ./compose/postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: "chrislusf/seaweedfs@sha256:cea8339d21dad1b200adce581dd7434d254b8f5975f142c3b4c930ba78647eef"
    restart: unless-stopped
    command: >
      server
      -s3
      -s3.config=/etc/seaweedfs/s3.json
      -s3.port=8333
      -volume.max=100
      -master.volumeSizeLimitMB=1024
      -dir=/data
    volumes:
      - ./compose/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  chrome:
    image: "chromedp/headless-shell@sha256:b24482ae166e2c67135f5a8ba9575c257efdd8e2fd6b2e931f9d88ede3d72f3b"
    restart: unless-stopped
    command:
      - "--headless"
      - "--disable-gpu"
      - "--disable-dev-shm-usage"
      - "--hide-scrollbars"
      - "--mute-audio"
      - "--no-default-browser-check"
      - "--no-first-run"
      - "--disable-background-networking"
      - "--disable-background-timer-throttling"
      - "--disable-extensions"

volumes:
  compplus-data:
  postgres-data:
  seaweedfs-data:
