services:
  compplus:
    image: "artifact.probo.inc/probo/probo:latest"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PROBOD_BASE_URL: "http://72.61.16.251:8080"
      PROBOD_API_ADDR: ":8080"
      PROBOD_API_CORS_ALLOWED_ORIGINS: "http://72.61.16.251:8080"

      PROBOD_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_ENCRYPTIONKEY}
      PROBOD_AUTH_COOKIE_SECRET: ${SERVICE_PASSWORD_64_COOKIESECRET}
      PROBOD_AUTH_PASSWORD_PEPPER: ${SERVICE_PASSWORD_64_PASSWORDPEPPER}
      PROBOD_TRUST_AUTH_TOKEN_SECRET: ${SERVICE_PASSWORD_64_TRUSTTOKEN}

      PROBOD_AUTH_COOKIE_NAME: "COMPPLUS_SSID"
      PROBOD_AUTH_COOKIE_DOMAIN: "72.61.16.251"
      PROBOD_AUTH_COOKIE_SECURE: "false"
      PROBOD_AUTH_COOKIE_SAMESITE: "lax"
      PROBOD_AUTH_DISABLE_SIGNUP: "false"

      PROBOD_PG_ADDR: "postgres:5432"
      PROBOD_PG_USERNAME: "probod"
      PROBOD_PG_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      PROBOD_PG_DATABASE: "probod"
      PROBOD_PG_POOL_SIZE: "100"
      PROBOD_PG_MIN_POOL_SIZE: "10"

      PROBOD_AWS_REGION: "us-east-1"
      PROBOD_AWS_BUCKET: "probod"
      PROBOD_AWS_ACCESS_KEY_ID: "probod"
      PROBOD_AWS_SECRET_ACCESS_KEY: "thisisnotasecret"
      PROBOD_AWS_ENDPOINT: "http://seaweedfs:8333"
      PROBOD_AWS_USE_PATH_STYLE: "true"

      PROBOD_CHROME_DP_ADDR: "chrome:9222"
      PROBOD_METRICS_ADDR: ":8081"
      PROBOD_TRACING_ADDR: ""

      PROBOD_TRUST_CENTER_HTTP_ADDR: ":10080"
      PROBOD_TRUST_CENTER_HTTPS_ADDR: ":10443"
      PROBOD_TRUST_CENTER_BASE_DOMAIN: "72.61.16.251"

      PROBOD_SMTP_ADDR: ""
      PROBOD_SMTP_TLS_REQUIRED: "false"
      PROBOD_MAILER_SENDER_NAME: "CompPlus"
      PROBOD_MAILER_SENDER_EMAIL: "no-reply@example.com"

      PROBOD_OPENAI_API_KEY: ""
      PROBOD_ANTHROPIC_API_KEY: ""
      PROBOD_AGENT_DEFAULT_PROVIDER: "openai"
      PROBOD_AGENT_DEFAULT_MODEL_NAME: "gpt-4o"

    volumes:
      - compplus-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      chrome:
        condition: service_started

  postgres:
    image: "postgres:17.4"
    restart: unless-stopped
    shm_size: "1g"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: "probod"
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: "probod"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-compplus.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probod -d probod"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: "chrislusf/seaweedfs:4.13"
    restart: unless-stopped
    command: >
      server
      -s3
      -s3.config=/etc/seaweedfs/s3.json
      -s3.port=8333
      -volume.max=100
      -master.volumeSizeLimitMB=1024
      -dir=/data
    configs:
      - source: seaweed-s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data

  chrome:
    image: "chromedp/headless-shell:140.0.7259.2"
    restart: unless-stopped
    command:
      - "--headless"
      - "--disable-gpu"
      - "--disable-dev-shm-usage"
      - "--hide-scrollbars"
      - "--mute-audio"
      - "--no-default-browser-check"
      - "--no-first-run"
      - "--disable-background-networking"
      - "--disable-background-timer-throttling"
      - "--disable-extensions"

configs:
  postgres-init:
    content: |
      ALTER DATABASE probod SET probo.trust_center_base_domain TO '72.61.16.251';
  seaweed-s3:
    content: |
      {
        "identities": [
          {
            "name": "probod",
            "credentials": [
              {
                "accessKey": "probod",
                "secretKey": "thisisnotasecret"
              }
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging", "Lock"]
          }
        ]
      }

volumes:
  compplus-data:
  postgres-data:
  seaweedfs-data:
